services:
  backend:
    build: ./backend
    container_name: docrag-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: docrag-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
